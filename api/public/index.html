<style>
:root{--bg:#07050f;--surface:#110b1f;--surface2:#1a0d30;--border:#2a1a45;--orange:#f5820a;--orange2:#ffb347;--gold:#ffd700;--purple:#7c3aed;--text:#e8e0ff;--muted:#7060a0;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;min-height:100vh;display:flex;flex-direction:column;}
.topbar{background:linear-gradient(90deg,#110b1f,#0d0820);border-bottom:1px solid var(--border);padding:0 28px;height:56px;display:flex;align-items:center;gap:20px;flex-shrink:0;}
.logo{font-family:'Bebas Neue',sans-serif;font-size:24px;background:linear-gradient(90deg,var(--orange),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:3px;}
.topbar-sep{width:1px;height:24px;background:var(--border);}
.topbar-spacer{flex:1;}
.ai-badge{display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,#2d1054,#1a0a2e);border:1px solid var(--purple);border-radius:20px;padding:4px 12px;font-size:11px;color:#c0a0ff;font-weight:700;}
.ai-dot{width:6px;height:6px;border-radius:50%;background:var(--purple);box-shadow:0 0 6px var(--purple);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.layout{display:grid;grid-template-columns:360px 1fr;flex:1;overflow:hidden;}
.panel{background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;padding:20px 18px;display:flex;flex-direction:column;gap:18px;}
.section-label{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--orange);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.section-label::after{content:'';flex:1;height:1px;background:var(--border);}
.upload-zone{border:2px dashed var(--border);border-radius:10px;padding:20px 16px;text-align:center;cursor:pointer;transition:all .2s;background:#0a0618;position:relative;}
.upload-zone:hover{border-color:var(--orange);background:#140824;}
.upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;}
.upload-icon{font-size:28px;margin-bottom:6px;}
.upload-zone h4{font-size:13px;color:#c0a0e0;margin-bottom:3px;}
.upload-zone p{font-size:11px;color:var(--muted);}
.upload-zone p strong{color:var(--orange2);}
.product-scroll{display:flex;flex-direction:column;gap:5px;max-height:240px;overflow-y:auto;}
.p-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);cursor:pointer;transition:all .15s;}
.p-item:hover{border-color:var(--orange);}
.p-item.active{border-color:var(--orange);background:#2d1054;}
.p-num{background:var(--orange);color:#000;font-weight:900;font-size:10px;border-radius:4px;padding:2px 5px;flex-shrink:0;}
.p-info{flex:1;min-width:0;}
.p-name{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.p-price{font-size:10px;color:var(--gold);margin-top:1px;}
.format-pills{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.format-pill{background:var(--surface2);border:2px solid var(--border);border-radius:8px;padding:10px 8px 8px;cursor:pointer;text-align:center;transition:all .15s;color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;letter-spacing:1px;}
.format-pill:hover,.format-pill.active{border-color:var(--orange);color:var(--text);}
.format-pill.active{background:#2d1054;}
